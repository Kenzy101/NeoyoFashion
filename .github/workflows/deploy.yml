name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-flight runs finish; queued ones collapse.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # GitHub Pages serves a project site from /<repo>. Everything that builds
  # a URL reads this, so assets resolve under the sub-path.
  #
  # Set it to an empty string if you move the site to a custom domain —
  # then it is served from the root and the prefix must go.
  NEXT_PUBLIC_BASE_PATH: /NeoyoFashion

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Best effort only. Enabling Pages through the API needs a token with
      # write access, which a repository set to read-only workflow
      # permissions will refuse. The build must not depend on it — if this
      # step fails, the artifact is still produced and the deploy job
      # reports the real problem.
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Turn a cryptic deploy failure into an instruction. Enabling Pages
      # through the API needs a write-scoped token, which a repository set
      # to read-only workflow permissions will refuse — and no workflow can
      # grant itself more than the repository allows.
      - name: Explain Pages setup if it could not be enabled
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::warning title=GitHub Pages is not enabled::The workflow could not enable it automatically."
          echo ""
          echo "The build below will still run and produce the site, but the deploy"
          echo "step cannot publish until Pages is switched on by hand — twice clicked,"
          echo "once and for all:"
          echo ""
          echo "  1. Settings -> Pages -> Build and deployment -> Source: GitHub Actions"
          echo "  2. Settings -> Actions -> General -> Workflow permissions:"
          echo "     Read and write permissions"
          echo ""
          echo "Then re-run this workflow (Actions -> Deploy to GitHub Pages -> Run workflow)."

      - run: npm ci

      - name: Build static site
        run: npm run build

      - name: Add .nojekyll
        # Without this, GitHub's Jekyll pass strips the _next directory and
        # the entire site loads unstyled.
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
