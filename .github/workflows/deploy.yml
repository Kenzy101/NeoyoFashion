name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The built-in token is all that is needed — Pages deploys from within the
# repository, so there is no external credential to store anywhere.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-flight runs finish; queued ones collapse.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository if it is not already enabled,
          # so the first deploy does not need anyone to visit Settings.
          enablement: true

      - run: npm ci

      - name: Build static site
        env:
          # GitHub Pages serves project sites from /<repo>. Everything that
          # builds a URL reads this, so assets resolve under the sub-path.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Add .nojekyll
        # Without this, GitHub's Jekyll pass strips the _next directory and
        # the entire site loads unstyled.
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
